name: ci-cd

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Check-out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.9.13'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Smoke test
      working-directory: ${{ runner.temp }}
      run: |
        python - <<'PY'
        import os

        import goblin_cbm_runner
        from goblin_cbm_runner.scenario_generator import NationalScenarioGenerator
        from goblin_cbm_runner.dynamic_scenario_generator import DynamicScenarioGenerator
        from goblin_cbm_runner.standard_sim_generator import StandardSimGenerator
        from goblin_cbm_runner.dynamic_standard_sim_generator import DynamicStandardSimGenerator
        from goblin_cbm_runner.resource_manager.utils.paths import Paths
        import goblin_cbm_runner.database as database

        # The bundled databases are listed in pyproject's `include`; assert they
        # survived the wheel build rather than trusting the manifest.
        bundled = {
            "AIDB": Paths().get_aidb_path(),
            "runner DB": os.path.join(
                database.get_local_dir(), "cbm_runner_database_0.6.2.db"
            ),
        }
        for label, path in bundled.items():
            if not os.path.isfile(path):
                raise SystemExit(f"{label} missing from installed package: {path}")
            print(f"{label} OK ({os.path.getsize(path) / 1e6:.1f} MB)")

        print("smoke test passed")
        PY
